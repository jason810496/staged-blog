name: Deploy source branch to staging

run-name: Deploy jason810496/blog@${{ inputs.source_branch }} to staging

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch in jason810496/blog to deploy
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staged-pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build jason810496/blog
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1
      STAGING_BASE_URL: https://staged-blog.zhu424.dev/
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Check out requested blog branch
        uses: actions/checkout@v4
        with:
          repository: jason810496/blog
          ref: ${{ inputs.source_branch }}
          submodules: recursive
          persist-credentials: false

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build staging site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --baseURL "${STAGING_BASE_URL}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy staging site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
